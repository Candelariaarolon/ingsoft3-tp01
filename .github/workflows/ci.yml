name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # Por job y no arriba de todo: a nivel workflow reemplazaría el default de
    # TODOS los jobs. Solo el que publica necesita escribir paquetes.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/backend-coverage:/salida" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del backend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      # Los dos pasos que publican van ÚLTIMOS y sin !cancelled(): si los tests
      # fallan, el job muere antes y nunca llegan a correr. La condición de
      # "sólo si pasó la verificación" no está escrita en un if: está en el orden.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El nombre va escrito a mano y en minúsculas: github.repository trae la
      # mayúscula del usuario y ghcr.io la rechaza.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/candelariaarolon/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    # Por job y no arriba de todo: a nivel workflow reemplazaría el default de
    # TODOS los jobs. Solo el que publica necesita escribir paquetes.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # Los dos pasos que publican van ÚLTIMOS y sin !cancelled(): si los tests
      # fallan, el job muere antes y nunca llegan a correr. La condición de
      # "sólo si pasó la verificación" no está escrita en un if: está en el orden.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El nombre va escrito a mano y en minúsculas: github.repository trae la
      # mayúscula del usuario y ghcr.io la rechaza.
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/candelariaarolon/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # La promoción arranca donde termina la verificación: sin los dos builds en
  # verde no hay deploy, y en un PR no corre (sólo lo integrado a main despliega).
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    # Con esto el job ve los secrets del environment qa (los hooks) y cada
    # deploy queda en el historial de Deployments del repo. QA no tiene reglas
    # de protección: es automático a propósito.
    environment: qa
    steps:
      # El &ref= es lo que hace que se despliegue EL commit verificado y no la
      # punta de main: con dos merges seguidos, sin esto la corrida del primero
      # desplegaría el segundo. Va con & porque el hook ya trae ?key=.
      # Render vuelve a construir ese commit desde el repo: se despliega el
      # commit verificado, no la imagen verificada (eso lo cambia el TP7).
      - name: Disparar el deploy de QA en Render, del commit verificado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          curl -fsS --max-time 30 -o /dev/null "$HOOK_API&ref=$GITHUB_SHA"
          curl -fsS --max-time 30 -o /dev/null "$HOOK_FRONT&ref=$GITHUB_SHA"

      # Reintenta porque Render tarda en construir y el plan gratis duerme los
      # servicios (el primer pedido tarda ~30 s). Mientras construye, Render
      # sigue sirviendo la versión anterior, que también contesta 200: por eso
      # no alcanza con que responda, tiene que estar corriendo ESTE commit.
      - name: Smoke test de QA, espera a que corra este commit
        shell: bash
        env:
          URL_API: https://curatta-api-qa.onrender.com
          URL_FRONT: https://curatta-front-qa.onrender.com
        run: |
          for i in $(seq 1 45); do
            # Todos los chequeos van DENTRO del if, como en la guía: GitHub corre
            # bash con -e, y un curl que falla fuera de un if corta el paso en la
            # primera vuelta en vez de dejar que el loop reintente.
            if COMMIT=$(curl -fsS --max-time 10 "$URL_API/api/health" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p') \
               && [ "$COMMIT" = "$GITHUB_SHA" ] \
               && curl -fsS --max-time 10 -o /dev/null "$URL_API/api/health/db" \
               && curl -fsS --max-time 10 -o /dev/null "$URL_FRONT/" \
               && curl -fsS --max-time 10 -o /dev/null "$URL_FRONT/api/health/db"; then
              echo "✅ QA corre $GITHUB_SHA: api, base y front responden"; exit 0
            fi
            echo "vuelta $i: la api corre ${COMMIT:-nada todavía}, espero $GITHUB_SHA"
            sleep 20
          done
          echo "❌ QA no quedó corriendo $GITHUB_SHA a tiempo"; exit 1

  # PROD sólo después de QA vivo con este commit. No repite el if de la rama:
  # depende de deploy-qa, que sí lo tiene, así que en un PR ninguno de los dos
  # corre.
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-qa
    # El environment production tiene un required reviewer: acá la corrida se
    # pausa en "Waiting for review" hasta que alguien apruebe o rechace. Los
    # hooks de PROD sólo los puede leer un job aprobado hacia production.
    environment: production
    # Evita dos deploys a PROD pisándose. No ordena la cola de aprobaciones:
    # si quedan dos corridas esperando, la vieja hay que rechazarla a mano.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # Acá el &ref= importa más que en QA: entre que la corrida queda esperando
      # y alguien la aprueba pueden pasar horas, y main se mueve. Sin el ref,
      # se aprobaría el commit A y a PROD subiría lo último que haya.
      - name: Disparar el deploy de PROD en Render, del commit aprobado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          curl -fsS --max-time 30 -o /dev/null "$HOOK_API&ref=$GITHUB_SHA"
          curl -fsS --max-time 30 -o /dev/null "$HOOK_FRONT&ref=$GITHUB_SHA"

      - name: Smoke test de PROD, espera a que corra este commit
        shell: bash
        env:
          URL_API: https://curatta-api-prod.onrender.com
          URL_FRONT: https://curatta-front-prod.onrender.com
        run: |
          for i in $(seq 1 45); do
            # Mismo smoke que QA: todos los chequeos dentro del if, para que un
            # timeout del cold start cuente como "todavía no" y no corte el paso.
            if COMMIT=$(curl -fsS --max-time 10 "$URL_API/api/health" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p') \
               && [ "$COMMIT" = "$GITHUB_SHA" ] \
               && curl -fsS --max-time 10 -o /dev/null "$URL_API/api/health/db" \
               && curl -fsS --max-time 10 -o /dev/null "$URL_FRONT/" \
               && curl -fsS --max-time 10 -o /dev/null "$URL_FRONT/api/health/db"; then
              echo "✅ PROD corre $GITHUB_SHA: api, base y front responden"; exit 0
            fi
            echo "vuelta $i: la api corre ${COMMIT:-nada todavía}, espero $GITHUB_SHA"
            sleep 20
          done
          echo "❌ PROD no quedó corriendo $GITHUB_SHA a tiempo"; exit 1
