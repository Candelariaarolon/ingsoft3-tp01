name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # Por job y no arriba de todo: a nivel workflow reemplazaría el default de
    # TODOS los jobs. Solo el que publica necesita escribir paquetes.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/backend-coverage:/salida" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del backend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      # Los dos pasos que publican van ÚLTIMOS y sin !cancelled(): si los tests
      # fallan, el job muere antes y nunca llegan a correr. La condición de
      # "sólo si pasó la verificación" no está escrita en un if: está en el orden.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El nombre va escrito a mano y en minúsculas: github.repository trae la
      # mayúscula del usuario y ghcr.io la rechaza.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/candelariaarolon/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    # Por job y no arriba de todo: a nivel workflow reemplazaría el default de
    # TODOS los jobs. Solo el que publica necesita escribir paquetes.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # Los dos pasos que publican van ÚLTIMOS y sin !cancelled(): si los tests
      # fallan, el job muere antes y nunca llegan a correr. La condición de
      # "sólo si pasó la verificación" no está escrita en un if: está en el orden.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El nombre va escrito a mano y en minúsculas: github.repository trae la
      # mayúscula del usuario y ghcr.io la rechaza.
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/candelariaarolon/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # La promoción arranca donde termina la verificación: sin los dos builds en
  # verde no hay deploy, y en un PR no corre (sólo lo integrado a main despliega).
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]   # sin CI verde no hay imagen
    if: github.ref == 'refs/heads/main'
    # Con esto el job ve los secrets del environment qa (los hooks) y cada
    # deploy queda en el historial de Deployments del repo. QA no tiene reglas
    # de protección: es automático a propósito.
    environment: qa
    steps:
      # El hook ya no dice qué commit construir: dice qué IMAGEN ejecutar, la
      # sha-<commit> que publicaron los jobs de build de esta misma corrida.
      # --get --data-urlencode la agrega con '&' (el hook ya trae ?key=…) y le
      # codifica los ':' y '/'. La URL del hook va última: es el único argumento
      # suelto, y --data-urlencode se lleva el valor que tiene al lado.
      # El nombre va a mano y en minúsculas, igual que en los jobs de build.
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/candelariaarolon/ingsoft3-tp01-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/candelariaarolon/ingsoft3-tp01-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      # Reintenta porque el plan gratis duerme los servicios (el primer pedido
      # tarda ~30 s). Prueba que QA responde: la api, la base (/api/health/db) y
      # el front. No prueba qué imagen corre: eso se mira en Events de Render.
      - name: Smoke test (espera a que QA responda)
        shell: bash
        env:
          URL_API: https://curatta-api-qa.onrender.com
          URL_FRONT: https://curatta-front-qa.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/api/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_API/api/health/db" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ QA responde (API + BD + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  # Las dos suites contra QA, encadenadas: integración primero (sin navegador,
  # segundos), e2e después. Si la api está rota, no gastamos un browser en
  # confirmarlo. Las dos usan el usuario de prueba de QA (secrets del repo).
  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa                       # QA ya está ejecutando la imagen de ESTA corrida
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install (sin browser)
        run: npm ci                        # sin `playwright install`: estas pruebas no abren navegador
        working-directory: ./frontend

      - name: Integración contra la api de QA
        env:
          API_BASE_URL: https://curatta-api-qa.onrender.com    # la api, no el front
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion   # distinto del de e2e: dos iguales rompen la corrida
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: integracion                     # si la api está rota, no gastamos un browser en confirmarlo
    timeout-minutes: 20                    # si algo se cuelga, el job muere en vez de esperar horas
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install + browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: e2e contra QA
        env:
          E2E_BASE_URL: https://curatta-front-qa.onrender.com   # el front de QA
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test e2e/publicaciones.spec.js   # SU archivo: sin esto vuelve a correr la integración
        working-directory: ./frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}            # el reporte importa MÁS cuando falla (y no cuando cancelás)
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  # PROD sólo después de que las dos suites pasaron contra QA. No repite el if
  # de la rama: la cadena arranca en deploy-qa, que sí lo tiene.
  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e                             # EL gate: sin e2e verde, ni siquiera se pide aprobación
    # El environment production tiene un required reviewer: acá la corrida se
    # pausa en "Waiting for review" hasta que alguien apruebe o rechace.
    environment: production
    # Evita dos deploys a PROD pisándose. No ordena la cola de aprobaciones:
    # si quedan dos corridas esperando, la vieja hay que rechazarla a mano.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # La MISMA imagen que se desplegó en QA: se promueve lo que se verificó.
      - name: Deploy de la MISMA imagen a PROD
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/candelariaarolon/ingsoft3-tp01-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/candelariaarolon/ingsoft3-tp01-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD (espera a que PROD responda)
        shell: bash
        env:
          URL_API: https://curatta-api-prod.onrender.com
          URL_FRONT: https://curatta-front-prod.onrender.com
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/api/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_API/api/health/db" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ PROD responde (API + BD + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
