services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: curatta
    volumes:
      - curatta-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/curatta
      JWT_SECRET: ${JWT_SECRET}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # node:20-slim no trae curl ni wget — Node ya está, así que el
      # healthcheck lo hace con el http nativo. /api/auth/me no requiere
      # sesión y siempre responde 200, sirve como "¿el server ya escucha?"
      # sin depender de datos ni de una cuenta de prueba.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4000/api/auth/me', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:4000
    environment:
      JWT_SECRET: ${JWT_SECRET}
      BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  curatta-db-data:
